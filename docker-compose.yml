# 墨染酒馆容器化部署：两套系统
#   ink-tavern     主服务（剧本/存档/对话/设置），宿主机端口 23456（容器内 8080）
#   cloud          云端公共剧本库，宿主机端口 23457（容器内 8787）
#
# 用法：
#   docker compose up -d --build        # 构建并启动
#   docker compose ps                    # 查看状态
#   docker compose logs -f ink-tavern    # 查看日志
#   docker compose down                  # 停止（保留数据卷）
#
# 端口说明：左侧为宿主机端口（外部访问用），右侧为容器内固定端口。
# 若宿主机端口仍被占用，改成其他冷门端口即可，如 "34560:8080"。

services:
  ink-tavern:
    # C 端自包含模块（client/）：server 后端 + web 前端，多阶段构建内嵌
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ink-tavern
    ports:
      - "23456:8080"
    volumes:
      # 主服务数据（SQLite 库）挂载到宿主机 ./data/server
      - ./data/server:/data
    restart: unless-stopped

  cloud:
    # 云库独立模块（cloud/），纯 Go 标准库
    build:
      context: ./cloud
      dockerfile: Dockerfile
    container_name: ink-tavern-cloud
    ports:
      - "23457:8787"
    volumes:
      # 云端公共库数据（剧本库 JSON 文件）挂载到宿主机 ./data/cloud
      - ./data/cloud:/data
    restart: unless-stopped
